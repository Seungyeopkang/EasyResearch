<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>EasyResearch</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-icon">e<span>.</span></span><div><strong>EasyResearch</strong><small>RESEARCH WORKSPACE</small></div></div>
      <div class="side-label">워크스페이스</div>
      <nav aria-label="주 메뉴">
        <button class="nav active" data-view="library"><span>▦</span> 논문 보관함</button>
        <button class="nav" data-view="search"><span>⌕</span> 논문 찾기</button>
        <button class="nav" data-view="analysis"><span>✳</span> 분석과 비교</button>
        <button class="nav" data-view="ideas"><span>◇</span> 아이디어</button>
        <button class="nav" data-view="experiments"><span>⌁</span> 실험</button>
      </nav>
      <div class="side-divider"></div>
      <div class="side-label">현재 프로젝트</div>
      <label class="sr-only" for="project-select">현재 프로젝트</label><select id="project-select"><option value="">프로젝트 선택</option></select>
      <button class="subtle-btn" id="new-project">＋ 프로젝트 만들기</button>
      <button class="subtle-btn" id="edit-project" disabled>프로젝트 수정</button>
      <button class="subtle-btn" id="delete-project" disabled>프로젝트 휴지통으로 이동</button>
      <button class="subtle-btn" id="trash-open">휴지통 및 복구</button>
      <div class="sidebar-bottom"><span class="status-dot"></span><span id="connection">연결 확인 중</span><button id="backup-open">백업</button></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">WORKSPACE <span>/</span> <b id="crumb">논문 보관함</b></div><div class="top-right"><span id="project-label">프로젝트를 선택하세요</span><span class="avatar">ER</span></div></header>
      <main id="main" tabindex="-1"><div id="message" role="status" aria-live="polite"></div><div id="content"></div></main>
    </div>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
