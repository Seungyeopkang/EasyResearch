<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>EasyResearch</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand"><span class="brand-icon">e<span>.</span></span><div><strong>EasyResearch</strong><small>RESEARCH WORKSPACE</small></div></div>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar-body">메뉴</button>
      </div>
      <div class="sidebar-body" id="sidebar-body">
        <div class="side-label">서재</div>
        <nav aria-label="서재 메뉴">
          <button class="nav active" data-view="library"><span>▦</span> 내 서재</button>
          <button class="nav" data-view="search"><span>⌕</span> 논문 찾기</button>
          <button class="nav" data-view="categories"><span>≡</span> 분야</button>
        </nav>
        <div class="side-divider"></div>
        <div class="side-label">연구 도우미</div>
        <nav aria-label="연구 도우미 메뉴">
          <button class="nav" data-view="research-chat"><span>✎</span> 연구 채팅</button>
          <button class="nav" data-view="gaps"><span>◌</span> 갭 찾기</button>
          <button class="nav" data-view="research-loop"><span>↻</span> 자동 연구</button>
          <button class="nav" data-view="graph"><span>⋈</span> 연결 그래프</button>
          <button class="nav" data-view="ai-settings"><span>⚙</span> AI 설정</button>
        </nav>
        <div class="side-divider"></div>
        <div class="side-label">연구 프로젝트</div>
        <label class="sr-only" for="project-select">현재 프로젝트</label><select id="project-select"><option value="">프로젝트 선택</option></select>
        <nav aria-label="프로젝트 메뉴">
          <button class="nav" data-view="overview"><span>◎</span> 프로젝트 개요</button>
          <button class="nav" data-view="analysis"><span>✳</span> 분석과 비교</button>
          <button class="nav" data-view="ideas"><span>◇</span> 아이디어</button>
          <button class="nav" data-view="experiments"><span>⌁</span> 실험</button>
        </nav>
        <button class="subtle-btn" id="new-project">＋ 프로젝트 만들기</button>
        <button class="subtle-btn" id="edit-project" disabled>프로젝트 수정</button>
        <button class="subtle-btn" id="delete-project" disabled>프로젝트 휴지통으로 이동</button>
        <button class="subtle-btn" id="trash-open">휴지통 및 복구</button>
        <div class="sidebar-bottom"><span class="status-dot" id="connection-dot"></span><span id="connection">연결 확인 중</span><button id="backup-open">백업</button></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">WORKSPACE <span>/</span> <b id="crumb">내 서재</b></div><div class="top-right"><span id="project-label">프로젝트 없이 서재를 사용합니다</span><span class="avatar">ER</span></div></header>
      <main id="main" tabindex="-1"><div id="message" role="status" aria-live="polite"></div><div id="content"></div></main>
    </div>
  </div>
  <button class="selection-translate" id="selection-translate" type="button" hidden>번역</button>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
